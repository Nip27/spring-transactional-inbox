name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TESTCONTAINERS_RYUK_DISABLED: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Verify Docker is available
        run: docker info

      - name: Build and test
        run: |
          ./mvnw -B clean verify || {
            echo "=== Test failures ==="
            find . -path '*/surefire-reports/*.txt' -exec grep -l -E 'FAILURE|ERROR' {} \; -exec cat {} \;
            exit 1
          }

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: |
            inbox-events-contract/target/site/jacoco/jacoco.xml,
            order-service/target/site/jacoco/jacoco.xml,
            loyalty-service/target/site/jacoco/jacoco.xml
          fail_ci_if_error: true
